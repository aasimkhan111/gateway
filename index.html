<!DOCTYPE html>
<html>
<head>
  <title>Pay ₹100</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body style="text-align:center; margin-top:80px; font-family:sans-serif; background:#f5f5f5;">

  <h2>₹100 पेमेंट करा</h2>
  <p>Click the button below to pay via PhonePe / GPay</p>

  <button onclick="pay()" 
    style="padding:15px 30px; font-size:18px; background:#4CAF50; color:white; border:none; border-radius:8px; cursor:pointer;">
    Pay ₹100
  </button>

  <p style="margin-top:20px; color:red; font-size:14px;">
    ⚠️ कृपया मोबाईलवरूनच पेमेंट करा
  </p>

  <script>
    function isMobile() {
      return /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
    }

    function pay() {
      if (isMobile()) {
        window.location.href = "upi://pay?pa=9552231018@ybl&pn=Aasim&am=100&cu=INR";
        
        setTimeout(() => {
          alert("जर पेमेंट अ‍ॅप उघडले नाही तर कृपया QR वापरा किंवा पुन्हा प्रयत्न करा.");
        }, 2000);

      } else {
        alert("हा पेमेंट लिंक फक्त मोबाईलवर काम करतो. कृपया मोबाईलवरून उघडा.");
      }
    }
  </script>

</body>
</html>
